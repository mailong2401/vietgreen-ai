services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vietgreen-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_VOLUME:-qdrant_data}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vietgreen-net

  postgres:
    image: postgres:17
    container_name: vietgreen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietgreen_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vietgreen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vietgreen-net

volumes:
  qdrant_data:
    name: ${QDRANT_VOLUME:-qdrant_data}
  postgres_data:
    name: ${POSTGRES_VOLUME:-postgres_data}

networks:
  vietgreen-net:
    name: vietgreen-net
    driver: bridge
